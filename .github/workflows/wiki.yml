name: Wiki

# A check-run that actually reads wiki/** (agent-devops#1205): the Test workflow
# runs the TypeScript suites only, so a docs-only wiki PR had no CI covering it.
on:
  pull_request:
    branches: [main]
    paths:
      - "wiki/**"
      - "src/wiki/**"
      - ".github/workflows/wiki.yml"
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "src/wiki/**"
      - ".github/workflows/wiki.yml"

permissions:
  contents: read

jobs:
  check:
    name: Wiki Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Self-test (every rule must catch a planted defect)
        run: bun test src/wiki/__tests__/check-wiki.test.ts
      - name: Check wiki tree and (on PRs) the change
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail   # keep the checker's own exit code (1 problems / 2 cannot run) through tee
          if [ "$EVENT" = "pull_request" ]; then
            [ -n "$BASE_REF" ] || { echo "pull_request without a base ref — refusing to skip the change check"; exit 2; }
            bun src/wiki/check-wiki.ts --base "origin/$BASE_REF" | tee check-wiki.out
          else
            bun src/wiki/check-wiki.ts | tee check-wiki.out
          fi
          # The checker always ends with a "check-wiki: OK" line when it really ran clean.
          grep -q '^check-wiki: OK' check-wiki.out || { echo "check-wiki produced no OK summary"; exit 1; }
