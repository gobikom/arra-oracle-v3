name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install
      - run: bun test:unit --coverage
      # Coverage upload is informational (fail_ci_if_error: false), but codecov-action@v4 still
      # throws when its own upload fails (TLS handshake alert to the coverage service, from
      # 2026-10-05) — that red Unit Tests job also skips Integration. Keep it non-blocking.
      - name: Upload coverage
        id: codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        if: always()
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
      - name: Warn on coverage upload failure
        if: always() && steps.codecov.outcome == 'failure'
        run: echo "::warning title=Coverage upload failed::codecov-action failed (see the Upload coverage log); coverage for this run was not reported"

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install
      - run: mkdir -p ~/.oracle
      - run: bun test:integration:db
      - run: bun test:integration:mcp
      - name: Start server for HTTP tests
        run: |
          ORACLE_CHROMA_TIMEOUT=2000 bun run src/server.ts &
          for i in $(seq 1 30); do
            curl -sf http://localhost:47778/api/health && break || sleep 0.5
          done
      - run: bun test:integration:http
      - name: Stop server
        if: always()
        run: kill $(lsof -ti :47778) 2>/dev/null || true
